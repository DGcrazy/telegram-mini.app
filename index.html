<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZILA AI DeFi</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#05050a;
color:white;
overflow-x:hidden
}

/* animated particles background */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:#070714;
border-bottom:1px solid #1b1b2e
}

.logo{
font-size:24px;
font-weight:bold;
letter-spacing:2px;
cursor:pointer;
background:linear-gradient(90deg,#7a5cff,#00eaff);
-webkit-background-clip:text;
color:transparent
}

nav a{
margin-right:20px;
color:#aaa;
text-decoration:none
}

.wallet-btn{
background:#6a5cff;
border:none;
padding:10px 18px;
border-radius:10px;
color:white;
cursor:pointer
}

.wallet-menu{
position:absolute;
right:40px;
top:70px;
background:#0c0c18;
border:1px solid #1c1c33;
border-radius:10px;
display:none;
flex-direction:column;
min-width:160px
}

.wallet-menu button{
background:none;
border:none;
color:white;
padding:12px;
text-align:left;
cursor:pointer
}

.wallet-menu button:hover{background:#111124}

.container{
max-width:1200px;
margin:auto;
padding:30px
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px
}

.card{
background:#0c0c18;
padding:20px;
border-radius:14px;
border:1px solid #1c1c33
}

.big{font-size:24px;margin-top:10px}

.pool{
background:#0c0c18;
padding:20px;
border-radius:14px;
border:1px solid #1c1c33;
margin-bottom:20px
}

.swap{
background:#0c0c18;
padding:30px;
border-radius:14px;
border:1px solid #1c1c33;
max-width:420px;
margin:auto
}

.swap input{
width:100%;
padding:12px;
border-radius:8px;
border:none;
margin-top:10px;
background:#111124;
color:white
}

.swap button{
width:100%;
margin-top:12px;
padding:12px;
border:none;
border-radius:10px;
background:#6a5cff;
color:white;
cursor:pointer
}

.partners{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:30px;
margin-top:50px
}

.partner-card{
background:#0c0c18;
border:1px solid #1c1c33;
border-radius:16px;
padding:20px;
text-align:center
}

.partner-card img{
width:100%;
max-width:120px;
animation:rotate3d 8s linear infinite
}

@keyframes rotate3d{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}

.footer{text-align:center;padding:30px;color:#777;font-size:13px}

</style></head><body><canvas id="bg"></canvas>

<header><div class="logo" onclick="goHome()">ZILA AI</div><nav>
<a href="#" onclick="showHome()">Home</a>
<a href="#" onclick="showSwap()">Swap</a>
</nav><div style="position:relative"><button id="walletButton" class="wallet-btn" onclick="walletButtonClick()">Connect Wallet</button>

<div id="walletMenu" class="wallet-menu">
<button onclick="copyWallet()">Copy Address</button>
<button onclick="disconnectWallet()">Disconnect Wallet</button>
</div></div></header><div class="container" id="homeSection"><div class="dashboard"><div class="card">
<h3>Polygon Balance</h3>
<div class="big" id="maticBalance">0</div>
</div><div class="card">
<h3>ZILA Balance</h3>
<div class="big" id="zilaBalance">0</div>
</div><div class="card">
<h3>Total Value Locked</h3>
<div class="big" id="tvl">0</div>
</div><div class="card">
<h3>Pending Rewards</h3>
<div class="big" id="rewards">0</div>
<button onclick="claimReward()">Claim</button>
</div></div><h2 style="text-align:center;margin-top:40px">Partnership</h2><div class="partners"><div class="partner-card">
<img src="partner1.png">
<p>Partner</p>
</div><div class="partner-card">
<img src="partner2.png">
<p>Partner</p>
</div><div class="partner-card">
<img src="partner3.png">
<p>Partner</p>
</div><div class="partner-card">
<img src="partner4.png">
<p>Partner</p>
</div></div></div><div class="container" id="swapSection" style="display:none"><div class="swap"><h2>ZILA Swap</h2><label>From</label> <input id="swapFrom" placeholder="Amount">

<select id="fromToken" style="width:100%;margin-top:6px;padding:10px;background:#111124;color:white;border:none;border-radius:8px">
<option value="ZILA">ZILA</option>
<option value="USDT">USDT</option>
<option value="POL">POL</option>
</select><label style="margin-top:10px">To</label>

<select id="toToken" style="width:100%;margin-top:6px;padding:10px;background:#111124;color:white;border:none;border-radius:8px">
<option value="USDT">USDT</option>
<option value="ZILA">ZILA</option>
<option value="POL">POL</option>
</select><button onclick="swapToken()">Swap</button>

</div></div><div class="footer">ZILA AI DeFi Platform</div><script>

let provider;
let signer;
let userAddress=null;

const ZILA_TOKEN="YOUR_ZILA_TOKEN";

const erc20ABI=["function balanceOf(address) view returns(uint256)"];

function showSwap(){

document.getElementById("homeSection").style.display="none";

document.getElementById("swapSection").style.display="block";

}

function showHome(){

document.getElementById("homeSection").style.display="block";

document.getElementById("swapSection").style.display="none";

}

function goHome(){location.reload()}

async function walletButtonClick(){

if(!userAddress){

await connectWallet();

}else{

toggleMenu();

}

}

function toggleMenu(){

const menu=document.getElementById("walletMenu");

menu.style.display=menu.style.display==='flex'?'none':'flex';

}

async function connectWallet(){

await window.ethereum.request({method:'eth_requestAccounts'});

provider=new ethers.providers.Web3Provider(window.ethereum);

signer=provider.getSigner();

userAddress=await signer.getAddress();

await signer.signMessage("Sign to access ZILA AI platform");

updateWalletUI();

loadBalances();

setInterval(loadBalances,8000);

}

function updateWalletUI(){

const btn=document.getElementById("walletButton");

btn.innerText=userAddress.slice(0,6)+"..."+userAddress.slice(-4);

}

function copyWallet(){

navigator.clipboard.writeText(userAddress);

alert("Address copied");

}

function disconnectWallet(){

userAddress=null;

provider=null;

signer=null;

const btn=document.getElementById("walletButton");

btn.innerText="Connect Wallet";

}

async function loadBalances(){

if(!provider||!userAddress)return;

const balance=await provider.getBalance(userAddress);

const matic=ethers.utils.formatEther(balance);


document.getElementById("maticBalance").innerText=parseFloat(matic).toFixed(4);

const token=new ethers.Contract(ZILA_TOKEN,erc20ABI,provider);

const zilaBal=await token.balanceOf(userAddress);

const zila=ethers.utils.formatUnits(zilaBal,18);


document.getElementById("zilaBalance").innerText=parseFloat(zila).toFixed(2);

}

function swapToken(){

alert("Swap will execute via DEX router like QuickSwap once router address is added.");

}

/* animated background particles */

const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<80;i++){

particles.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2,

dx:(Math.random()-.5)*.5,

dy:(Math.random()-.5)*.5

})

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#7a5cff";

particles.forEach(p=>{

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fill();

p.x+=p.dx;
p.y+=p.dy;

if(p.x<0||p.x>canvas.width)p.dx*=-1;
if(p.y<0||p.y>canvas.height)p.dy*=-1;

});

requestAnimationFrame(animate);

}

animate();

</script></body>
  </html>
